# HTTP → HTTPS 轉址
# 適用 Traefik v3 和 v2.10 以上；更舊的 v2 要把 apiVersion 改成 traefik.containo.us/v1alpha1
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: pterodactyl
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTPS：cert-manager 自動簽發憑證
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panel
  namespace: pterodactyl
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod    # 改成你的 ClusterIssuer 名稱
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - panel.example.com          # 要跟 configmap.yaml 的 APP_URL 一致
      secretName: panel-tls
  rules:
    - host: panel.example.com        # 同上
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: panel
                port:
                  name: http
---
# HTTP：只負責轉址到 HTTPS，不會真的轉發到 Panel
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panel-http-redirect
  namespace: pterodactyl
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # 格式：<namespace>-<Middleware 名稱>@kubernetescrd，換 namespace 時要一起改
    traefik.ingress.kubernetes.io/router.middlewares: pterodactyl-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: panel.example.com        # 同上
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: panel
                port:
                  name: http